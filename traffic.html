<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="TRAFFIC: el Semáforo del Inversionista de Nork. Descubra si está listo para invertir en bienes raíces.">
</head>
<body>
<title>Semáforo del Inversionista Nork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Mulish:wght@400;500;600;700&family=Playfair+Display:wght@400;600&display=swap">
<style>
/* Layout: question flow on the left, a sticky street-signal housing on the right that re-lights on every answer; stacks to a top strip on phones. */
:root{
  --bg:#09121F; --panel:#0F1B2D; --panel-2:#13233A; --line:#22344F; --line-2:#2E4466;
  --fg:#E9EFF6; --muted:#93A4BA; --dim:#5F7290;
  --brand:#4CBB30; --brand-ink:#0B1A07; --gold:#C9A45C;
  --red:#EF4E4E; --amber:#F5A623; --green:#36C26A; --off:#1A2638;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Mulish", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 56px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:44px;width:auto}
.brand b{font-family:var(--display);font-size:18px;letter-spacing:.06em;display:block}
.brand small{color:var(--brand);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.lang{display:flex;border:1px solid var(--line-2);border-radius:999px;padding:3px}
.lang button{background:none;border:0;color:var(--muted);font:600 13px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.hero{padding-block:26px 8px;max-width:760px}
.hero .eyebrow{color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.hero h1{font-family:var(--display);font-size:clamp(28px,4.4vw,44px);line-height:1.08;margin:.3em 0 .35em;text-wrap:balance}
.hero p{color:var(--muted);margin:0;max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;margin-top:22px;align-items:start}
/* steps */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps span{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:600}
.steps span.on{color:var(--fg);border-color:var(--brand)}
.steps span.done{color:var(--brand);border-color:var(--line-2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
.card h2{font-family:var(--display);font-size:24px;margin:0 0 4px}
.card .sub{color:var(--muted);margin:0 0 22px}
.q{padding-block:16px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q label.ql,.q .ql{display:block;font-weight:700;margin-bottom:10px}
.q .hint{display:block;color:var(--muted);font-weight:500;font-size:13px;margin-top:2px}
.req{color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row2 .q{border-top:0;padding-top:0}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;background:var(--panel-2);border:1px solid var(--line-2);color:var(--fg);border-radius:10px;padding:11px 13px;font:500 15px var(--body)}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel-2);border:1px solid var(--line-2);color:var(--fg);border-radius:10px;padding:9px 14px;font:600 14px var(--body);cursor:pointer;text-align:left}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:rgba(76,187,48,.14);border-color:var(--brand);color:#fff}
.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.big .chip{padding:16px;display:flex;flex-direction:column;gap:4px}
.big .chip b{font-family:var(--display);font-size:17px}
.big .chip span{color:var(--muted);font-weight:500;font-size:13px}
.matrix{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.mrow .chips{gap:6px}.mrow .chip{padding:6px 10px;font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--brand)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 20px;font:700 15px var(--body);cursor:pointer}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line-2)}
.err{color:var(--red);font-weight:600;font-size:14px;margin-top:12px}
/* signal */
.signal{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.housing{background:linear-gradient(180deg,#141F31,#0C1625);border:1px solid var(--line-2);border-radius:22px;padding:22px 20px 18px;display:flex;gap:20px;align-items:center}
.lamps{display:flex;flex-direction:column;gap:12px;background:#060C16;border-radius:40px;padding:12px;border:1px solid var(--line)}
.lamp{width:52px;height:52px;border-radius:50%;background:var(--off);transition:background .35s, box-shadow .35s}
.lamp.r.lit{background:var(--red);box-shadow:0 0 22px 4px rgba(239,78,78,.55)}
.lamp.y.lit{background:var(--amber);box-shadow:0 0 22px 4px rgba(245,166,35,.5)}
.lamp.g.lit{background:var(--green);box-shadow:0 0 22px 4px rgba(54,194,106,.5)}
.verdict{min-width:0}
.verdict .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.verdict .v{font-family:var(--display);font-size:24px;line-height:1.1;margin:4px 0 6px}
.verdict .p{color:var(--muted);font-size:13px;margin:0}
.dims{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:12px}
.dim{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--off);border:1px solid var(--line-2)}
.dot.red{background:var(--red);border-color:var(--red)}.dot.yellow{background:var(--amber);border-color:var(--amber)}.dot.green{background:var(--green);border-color:var(--green)}
.dim .bar{grid-column:2/4;height:5px;background:var(--off);border-radius:4px;overflow:hidden}
.dim .bar i{display:block;height:100%;width:0;background:var(--muted);transition:width .4s}
.dim .st{color:var(--muted);font-variant-numeric:tabular-nums}
.legend{margin-top:12px;color:var(--dim);font-size:12px}
/* result */
.res-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px}
.pill.red{background:rgba(239,78,78,.15);color:#FF8A8A}.pill.yellow{background:rgba(245,166,35,.15);color:#FFC766}.pill.green{background:rgba(54,194,106,.15);color:#6BE59A}
.sec{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.sec h3{font-family:var(--display);font-size:18px;margin:0 0 10px}
.dimcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dc{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px}
.dc h4{margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;font-size:15px}
.dc p{margin:0;color:var(--muted);font-size:14px}
ul.clean{margin:0;padding-left:18px}ul.clean li{margin:4px 0}
.contact{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--muted);font-size:14px}
.contact b{color:var(--fg);user-select:all}
.note{color:var(--dim);font-size:12.5px;margin-top:16px}
.toast{margin-top:12px;font-weight:600;font-size:14px}
@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .signal{order:-1;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-20px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
  .housing{padding:10px 14px;gap:14px;border-radius:16px}
  .lamps{flex-direction:row;padding:7px;gap:8px}
  .lamp{width:26px;height:26px}
  .verdict .v{font-size:18px}.verdict .p{display:none}
  .dims{display:none}.legend{display:none}
}
@media (max-width:640px){
  .row2,.big,.dimcards{grid-template-columns:1fr}
  .card{padding:18px}
  .mrow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.lamp,.dim .bar i{transition:none}}

/* jeanpaulu.com site navigation */
nav.site{position:fixed;top:0;left:0;width:100%;z-index:999;background:rgba(10,22,40,.97);backdrop-filter:blur(10px);border-bottom:1px solid rgba(200,168,75,.3);padding:0 5%;padding-top:env(safe-area-inset-top,0px)}
nav.site .nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;height:70px;gap:1rem}
nav.site .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
nav.site .nav-logo span{font-family:'Playfair Display',Georgia,serif;font-size:1.15rem;color:#c8a84b;letter-spacing:1px;white-space:nowrap}
nav.site .nav-links{display:flex;gap:1.4rem;list-style:none;margin:0;padding:0}
nav.site .nav-links a{color:rgba(255,255,255,.8);text-decoration:none;font-size:.78rem;font-weight:500;letter-spacing:.5px;text-transform:uppercase;transition:color .3s;white-space:nowrap}
nav.site .nav-links a:hover,nav.site .nav-links a.active{color:#c8a84b}
nav.site .lang-btn{background:transparent;border:1px solid #c8a84b;color:#c8a84b;padding:6px 15px;border-radius:4px;font-size:.78rem;cursor:pointer;font-family:var(--body);letter-spacing:1px;transition:all .3s;flex-shrink:0}
nav.site .lang-btn:hover{background:#c8a84b;color:#0a1628}
nav.site .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:5px;background:none;border:none}
nav.site .hamburger span{display:block;width:24px;height:2px;background:#c8a84b}
.mobile-menu{display:none;position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:0;right:0;background:#0e1e38;border-bottom:1px solid rgba(200,168,75,.2);padding:1.4rem 5%;z-index:998;flex-direction:column;gap:.9rem}
.mobile-menu.open{display:flex}
.mobile-menu a{color:rgba(255,255,255,.8);text-decoration:none;font-size:1rem;padding:.45rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
.wrap{margin-top:70px}
@media(max-width:1050px){nav.site .nav-links{gap:1rem}nav.site .nav-links a{font-size:.72rem}}
@media(max-width:900px){nav.site .nav-links{display:none}nav.site .hamburger{display:flex}.signal{top:calc(70px + env(safe-area-inset-top,0px))}}
</style>

try{const s=JSON.parse(localStorage.getItem("nork-semaforo")||"null"); if(s){A=s.A||{}; lang=s.lang||"es";}}catch(e){}
if(location.hash==="#en") lang="en";

/* ===== Scoring ===== */
const clamp=v=>Math.max(0,Math.min(100,v));
function scores(){
 const s={exp:null,liq:null,cred:null,know:null};
 if(A.exp){
  if(A.exp==="none"){ s.exp=10+(A.ownHome==="yes"?8:0)+(A.academy&&A.academy!=="none"?6:0); s.exp=Math.min(s.exp,30);}
  if(A.exp==="some"){ s.exp=50+({"2":4,"3":8}[A.props]||0)+((A.fin||[]).includes("hm")?6:0)+(A.result==="profit"?6:A.result==="loss"?-6:0); s.exp=Math.min(Math.max(s.exp,42),69);}
  if(A.exp==="pro"){ s.exp=78+({"4-6":4,"7-12":8,"13+":12}[A.deals24]||0)+(A.hmUsed==="yes"?6:0)+((A.license||[]).some(x=>x!=="none")?4:0); s.exp=clamp(s.exp);}
 }
 if(A.liq){ s.liq={"20":12,"50":45,"80":60,"150":76,"300":88,"300+":97}[A.liq]; if(A.liqUS==="none") s.liq-=10; if(A.liqUS==="part") s.liq-=4; s.liq=clamp(s.liq);}
 if(A.credit){ s.cred={lt580:12,"580":36,"620":52,"660":70,"700":84,"740":95,unk:38,nous:A.loc==="abroad"||A.status==="foreign"?58:30}[A.credit]; if(A.derog==="yes") s.cred-=20; if(A.lates==="yes") s.cred-=10; s.cred=clamp(s.cred);}
 const k=A.know||{}; const kn=Object.keys(k).length;
 if(kn||A.realtor||A.llc||A.academy){ let v=0; TERMS.forEach(([id])=>{v+=k[id]==="yes"?8:k[id]==="heard"?4:0}); v+=A.realtor==="yes"?12:0; v+=(A.llc==="llc"||A.llc==="corp")?14:A.llc==="plan"?5:0; v+=A.understood==="yes"?10:A.understood==="part"?5:0; s.know=clamp(v);}
 return s;
}
const colorOf=v=>v==null?null:v>=70?"green":v>=40?"yellow":"red";
function overall(s){
 if(s.exp==null) return null;
 const W={exp:.30,liq:.35,cred:.25,know:.10}; let sum=0,w=0;
 for(const k in W) if(s[k]!=null){sum+=s[k]*W[k];w+=W[k];}
 let c=colorOf(sum/w); const rank={red:0,yellow:1,green:2}, cap=x=>{if(rank[c]>rank[x])c=x};
 if(A.exp==="none") cap("yellow");
 if(A.liq==="20") cap(A.exp==="none"?"red":"yellow");
 if(A.exp==="none"&&(A.liq==="20"||A.credit==="lt580")) cap("red");
 if(A.credit==="lt580") cap("yellow");
 if(A.derog==="yes") cap("yellow");
 if((A.status==="foreign"||A.loc==="abroad")&&A.liqUS==="none") cap("yellow");
 if(A.exp==="some"&&c==="green"&&(s.liq<70||s.cred<70)) c="yellow";
 return {c,score:Math.round(sum/w)};
}

/* ===== Signal ===== */
function paintSignal(){
 const s=scores(), ov=overall(s);
 ["lr","ly","lg"].forEach(id=>document.getElementById(id).classList.remove("lit"));
 document.getElementById("sig-lbl").textContent=t("sigLbl");
 if(!ov){document.getElementById("sig-v").textContent=t("start");document.getElementById("sig-p").textContent=t("startP");}
 else{document.getElementById({red:"lr",yellow:"ly",green:"lg"}[ov.c]).classList.add("lit");
  document.getElementById("sig-v").textContent=t(ov.c);document.getElementById("sig-p").textContent=t(ov.c+"P");}
 document.getElementById("dims").innerHTML=Object.keys(t("dims")).map(k=>{const v=s[k],c=colorOf(v);
  return `<div class="dim"><span class="dot ${c||""}"></span><span>${t("dims")[k]}</span><span class="st">${v==null?t("pending"):v+"/100"}</span><div class="bar"><i style="width:${v||0}%;background:${c?`var(--${c==="yellow"?"amber":c})`:"var(--muted)"}"></i></div></div>`}).join("");
 document.getElementById("legend").textContent=t("legend");
}

/* ===== Form rendering ===== */
function qHTML(q){
 const lab=`${esc(L(q))}${q.req?' <span class="req">*</span>':""}${q.hint?`<span class="hint">${esc(L(q.hint))}</span>`:""}`;
 const val=A[q.id];
 if(["text","email","tel"].includes(q.type)) return `<div class="q"><label class="ql" for="f-${q.id}">${lab}</label><input id="f-${q.id}" type="${q.type}" data-id="${q.id}" value="${esc(val||"")}" autocomplete="${{first:"given-name",last:"family-name",phone:"tel",email:"email"}[q.id]||"off"}"></div>`;
 if(q.type==="textarea") return `<div class="q"><label class="ql" for="f-${q.id}">${lab}</label><textarea id="f-${q.id}" data-id="${q.id}">${esc(val||"")}</textarea></div>`;
 if(q.type==="check") return `<div class="q"><label class="check" for="f-${q.id}"><input type="checkbox" id="f-${q.id}" data-id="${q.id}" ${val?"checked":""}><span>${lab}</span></label></div>`;
 if(q.type==="single"||q.type==="multi") return `<div class="q"><span class="ql" id="lb-${q.id}">${lab}</span><div class="chips" role="group" aria-labelledby="lb-${q.id}">${q.opts.map(op=>{const on=q.type==="multi"?(val||[]).includes(op.v):val===op.v;return `<button type="button" class="chip" id="c-${q.id}-${op.v}" data-q="${q.id}" data-v="${op.v}" data-m="${q.type==="multi"?1:0}" aria-pressed="${on}">${esc(op[lang])}</button>`}).join("")}</div></div>`;
 if(q.type==="big") return `<div class="q"><span class="ql" id="lb-${q.id}">${lab}</span><div class="chips big" role="group" aria-labelledby="lb-${q.id}">${q.opts.map(op=>`<button type="button" class="chip" id="c-${q.id}-${op.v}" data-q="${q.id}" data-v="${op.v}" data-m="0" aria-pressed="${val===op.v}"><b>${esc(op[lang])}</b><span>${esc(L(op.des))}</span></button>`).join("")}</div></div>`;
 if(q.type==="matrix"){const k=A.know||{};return `<div class="q"><span class="ql">${lab}</span><div class="matrix">${q.rows.map(([id,es,en])=>`<div class="mrow"><span>${esc(lang==="es"?es:en)}</span><div class="chips">${[["yes",t("yes")],["heard",t("heard")],["no",t("no")]].map(([v,l])=>`<button type="button" class="chip" id="c-know-${id}-${v}" data-know="${id}" data-v="${v}" aria-pressed="${k[id]===v}">${l}</button>`).join("")}</div></div>`).join("")}</div></div>`;}
 return "";
}
function renderForm(errMsg){
 const S=STEPS[step], qs=S.qs.filter(visible);
 let html="", i=0;
 while(i<qs.length){ if(qs[i].half&&qs[i+1]&&qs[i+1].half){html+=`<div class="row2">${qHTML(qs[i])}${qHTML(qs[i+1])}</div>`;i+=2;} else {html+=qHTML(qs[i]);i++;} }
 document.getElementById("main").innerHTML=`
  <div class="steps">${t("steps").map((n,j)=>`<span class="${j===step?"on":j<step?"done":""}">${j+1}. ${n}</span>`).join("")}</div>
  <form class="card" id="form" novalidate>
   <h2>${esc(L(S.title))}</h2><p class="sub">${esc(L(S.sub))}</p>
   ${html}
   ${errMsg?`<div class="err" role="alert">${errMsg}</div>`:""}

  </form>`;
}
function missing(){
 return STEPS[step].qs.filter(visible).filter(q=>q.req).some(q=>{const v=A[q.id];return Array.isArray(v)?!v.length:!v||(typeof v==="string"&&!v.trim())});
}

   yellow: es?"Su crédito califica para préstamos privados, pero con tasa y puntos más altos. Llegar a 660+ abre los programas DSCR de 30 y 40 años.":"Your credit qualifies for private loans, but with higher rate and points. Reaching 660+ opens 30- and 40-year DSCR programs.",
   green: es?"Su crédito le da acceso a mejores tasas, menos puntos y más apalancamiento. Evite abrir nuevas deudas hasta cerrar.":"Your credit gives you better rates, fewer points, and more leverage. Avoid opening new debt until you close."},
  know:{
   red: es?"Le faltan conceptos clave (ARV, SOW, hard money, DSCR, off-market) y un equipo. Sin eso, es fácil pagar de más o firmar un contrato que no puede cerrar.":"You're missing key concepts (ARV, SOW, hard money, DSCR, off-market) and a team. Without them it's easy to overpay or sign a contract you can't close.",
   yellow: es?"Conoce lo básico. Complete su equipo: un realtor inversionista, un contratista con licencia y su empresa (LLC).":"You know the basics. Complete your team: an investor-friendly realtor, a licensed contractor, and your company (LLC).",
   green: es?"Domina los términos y tiene equipo. Su ventaja ahora es velocidad: tener los papeles listos antes de firmar.":"You know the terms and have a team. Your edge now is speed: have documents ready before you sign."}
 };
 const need=[];
 const add=(e,n)=>need.push(es?e:n);
 if(A.exp==="none"){add("Antes de firmar un contrato, entienda el ARV, el alcance de obra (SOW) y cómo se entregan los draws.","Before signing a contract, understand ARV, scope of work (SOW), and how draws are released.");
  add("Su primer negocio debe dejar margen aunque el avalúo salga más bajo o la obra cueste 15% más.","Your first deal should still profit if the appraisal comes in lower or the rehab costs 15% more.");
  add("Considere un socio con experiencia o un acompañamiento: los prestamistas piden experiencia o más dinero propio.","Consider an experienced partner or guidance: lenders ask for experience or more of your own money.");}
 if(A.exp==="some"){add("Prepare su hoja de experiencia con cada salida y propiedad actual de los últimos 2 a 3 años.","Prepare your experience sheet with every exit and current property from the last 2–3 years.");
  add("Planee su salida antes de comprar: vender, o rentar y refinanciar a DSCR.","Plan your exit before buying: sell, or rent and refinance into DSCR.");}
 if(A.exp==="pro"){add("Con volumen, pida términos por relación: tasa y puntos mejoran con negocios repetidos y papeles listos.","With volume, ask for relationship terms: rate and points improve with repeat deals and ready documents.");
  add("Tenga su carpeta corporativa lista (artículos, acuerdo operativo, resolución, ACH) para cerrar en 15 días.","Keep your corporate file ready (articles, operating agreement, resolution, ACH) to close in 15 days.");}
 if(s.liq!=null&&s.liq<40) add("Meta de capital: junte al menos $25,000 a $50,000 más reservas antes de su primer negocio financiado.","Capital goal: save at least $25,000–$50,000 plus reserves before your first financed deal.");
 if(A.credit==="unk") add("Saque su reporte de crédito antes de la llamada: sin el número, no podemos darle términos reales.","Pull your credit report before the call: without the number we can't give you real terms.");
 if(s.cred!=null&&s.cred<52&&A.credit!=="nous") add("No abra tarjetas ni préstamos nuevos y pague todo a tiempo: cada punto de crédito cuenta.","Don't open new cards or loans, and pay everything on time: every credit point counts.");
 if(isForeign()) add("Como extranjero: pasaporte, fondos en un banco de EE. UU. al menos 30 días antes de invertir y 6 meses de reservas.","As a foreign national: passport, funds in a U.S. bank at least 30 days before investing, and 6 months of reserves.");
 if(!(A.llc==="llc"||A.llc==="corp")) add("Abra una LLC para invertir: los préstamos de inversión se cierran a nombre de la empresa.","Open an LLC to invest: investment loans close in the company's name.");
 if(A.realtor!=="yes") add("Busque un realtor que trabaje con inversionistas, o hable con el equipo de Nork Group para propiedades off-market.","Find a realtor who works with investors, or talk to the Nork Group team about off-market properties.");
 const prod=[]; const P=(e,n)=>prod.push(es?e:n);
 if(A.exp==="none"){ if(ov.c!=="red") P("Fix & Flip con acompañamiento: hasta 90% de la compra y hasta 100% de la remodelación, sujeto a aprobación.","Fix & Flip with guidance: up to 90% of purchase and up to 100% of rehab, subject to approval.");
  P("DSCR para comprar y rentar (30 o 40 años): califica con la renta de la propiedad, no con sus impuestos.","DSCR to buy and rent (30 or 40 years): qualifies on the property's rent, not your tax returns.");
  if(ov.c==="red") P("Hoy: educación y plan de capital y crédito. Volvemos a revisar en 90 días.","Today: education plus a capital and credit plan. We review again in 90 days.");}
 else { P("Fix & Flip: hasta 90% de la compra y hasta 100% de la remodelación, sujeto a aprobación.","Fix & Flip: up to 90% of purchase and up to 100% of rehab, subject to approval.");
  P("DSCR 30 o 40 años para sus propiedades de renta.","DSCR 30 or 40 years for your rentals.");
  P("Refinanciamiento cash-out para recuperar su capital y repetir.","Cash-out refinance to recover your capital and repeat.");
  if(A.exp==="pro"){P("Préstamo puente (bridge) para cerrar rápido o liberar capital.","Bridge loan to close fast or free up capital.");
   if((A.strategy||[]).includes("build")||(A.license||[]).includes("gc")) P("Construcción desde cero (ground-up) por desembolsos.","Ground-up construction funded in draws.");}}
 if(isForeign()) P("Programa para extranjeros: hasta 85% de financiamiento, solo pasaporte; términos y condiciones aplican.","Foreign national program: up to 85% financing, passport only; terms and conditions apply.");
 const next={
  green: es?"Entre al Portal Nork, complete su precalificación y un coordinador le llamará para emitir su carta de preaprobación.":"Log in to the Nork Portal, complete your pre-qualification, and a coordinator will call you to issue your pre-approval letter.",
  yellow: es?"Agende una llamada con un coordinador de Nork esta semana. Armamos su plan para pasar a verde y le decimos qué negocio puede cerrar hoy.":"Book a call with a Nork coordinator this week. We'll build your plan to reach green and tell you what deal you can close today.",
  red: es?"Asista al próximo taller y siga su plan de capital y crédito. Repita este semáforo en 90 días; le acompañamos en el camino.":"Attend the next workshop and follow your capital and credit plan. Retake this traffic light in 90 days; we'll guide you along the way."}[ov.c];
 return {s,ov,dimText,need,prod,next};
}

function renderResult(){
 const {s,ov,dimText,need,prod,next}=analysis(); paintSignal();
 const name=`${A.first||""} ${A.last||""}`.trim();
 const date=new Date().toLocaleDateString(lang==="es"?"es-US":"en-US",{year:"numeric",month:"long",day:"numeric"});
 document.getElementById("main").innerHTML=`
 <div class="card">
  <div class="res-head"><div style="min-width:0"><div class="eyebrow" style="color:var(--gold);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700">${t("resTitle")}</div>
   <h2 style="margin-top:6px">${esc(name)} · ${t("profile")[A.exp]||""}</h2>
   <p class="sub" style="margin:4px 0 0">${t("resDate")}: ${date} · <span class="pill ${ov.c}">${t(ov.c)} · ${ov.score}/100</span></p></div></div>
  <p style="margin:16px 0 0">${t(ov.c+"P")}</p>
  <div class="sec"><h3>${t("secDims")}</h3><div class="dimcards">${Object.keys(t("dims")).map(k=>{const c=colorOf(s[k])||"red";return `<div class="dc"><h4><span>${t("dims")[k]}</span><span class="pill ${c}">${s[k]??0}/100</span></h4><p>${dimText[k][c]}</p></div>`}).join("")}</div></div>
  <div class="sec"><h3>${t("secNeed")}</h3><ul class="clean">${need.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <div class="sec"><h3>${t("secProd")}</h3><ul class="clean">${prod.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <div class="sec"><h3>${t("secNext")}</h3><p style="margin:0">${esc(next)}</p></div>
  <div class="sec"><h3>${t("secContact")}</h3><div class="contact"><span>${lang==="es"?"Llamadas":"Call"}: <b>${CONTACT.call}</b></span><span>${lang==="es"?"Texto":"Text"}: <b>${CONTACT.text}</b></span><span><b>${CONTACT.email1}</b></span><span><b>${CONTACT.email2}</b></span><span><b>${CONTACT.web}</b></span></div></div>
  <div class="nav"><div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn pri" id="r-pdf">${t("pdf")}</button><button type="button" class="btn ghost" id="r-send">${t("send")}</button></div>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn ghost" id="r-edit">${t("edit")}</button><button type="button" class="btn ghost" id="r-restart">${t("restart")}</button></div></div>
  <div class="toast" id="toast" role="status"></div>
  <p class="note">${t("disclaimer")}</p>
 </div>`;
}
const toast=(m,ok)=>{const e=document.getElementById("toast"); if(e){e.textContent=m;e.style.color=ok?"var(--green)":"var(--amber)";}};

/* ===== Answers summary (for PDF + lead) ===== */
function answerRows(){
 const rows=[];
 STEPS.forEach(S=>S.qs.filter(visible).forEach(q=>{
  let v=A[q.id]; if(v==null||v===""||(Array.isArray(v)&&!v.length)) return;
  if(q.type==="matrix"){v=q.rows.filter(([id])=>v[id]).map(([id,es,en])=>`${lang==="es"?es:en}: ${({yes:t("yes"),heard:t("heard"),no:t("no")})[v[id]]}`).join("; ");}
  else if(q.type==="check") v=v?t("yes"):t("no");
  else if(q.opts){const f=x=>(q.opts.find(op=>op.v===x)||{})[lang]||x; v=Array.isArray(v)?v.map(f).join(", "):f(v);}
  rows.push([L(q),String(v)]);
 }));
 return rows;
}

/* ===== PDF ===== */
async function makePDF(){
 try{
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"pt",format:"letter"});
  const {s,ov,dimText,need,prod,next}=analysis();
  const W=612,M=48; let y=0;
  const NAVY=[11,27,46],GREEN=[76,187,48],INK=[30,39,51],MUT=[95,108,125];
  const COL={red:[229,72,77],yellow:[240,160,30],green:[46,170,90]};
  const header=()=>{doc.setFillColor(...NAVY);doc.rect(0,0,W,78,"F");doc.setFillColor(...GREEN);doc.rect(0,78,W,3,"F");
   try{doc.addImage(document.getElementById("logo").src,"PNG",M,14,84,49);}catch(e){}
   doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text("NORK CAPITAL LENDING",M+96,38);
   doc.setTextColor(...GREEN);doc.setFontSize(8.5);doc.text(t("tagline").toUpperCase(),M+96,53);
   doc.setTextColor(200,210,222);doc.setFont("helvetica","normal");doc.text(CONTACT.web,W-M,36,{align:"right"});doc.text(CONTACT.call,W-M,50,{align:"right"});y=110;};
  const ensure=h=>{if(y+h>740){footer();doc.addPage();header();}};
  const footer=()=>{doc.setDrawColor(213,220,227);doc.line(M,756,W-M,756);doc.setTextColor(...MUT);doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.text("Nork Capital Lending · Nork Group LLC · "+CONTACT.addr,M,770);};
  const h2=txt=>{ensure(40);y+=8;doc.setTextColor(...NAVY);doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text(txt,M,y);y+=16;};
  const para=(txt,size=10,col=INK,indent=0)=>{doc.setFont("helvetica","normal");doc.setFontSize(size);doc.setTextColor(...col);const lines=doc.splitTextToSize(txt,W-2*M-indent);lines.forEach(l=>{ensure(14);doc.text(l,M+indent,y);y+=size*1.4;});};
  const bullet=txt=>{doc.setFont("helvetica","normal");doc.setFontSize(10);const lines=doc.splitTextToSize(txt,W-2*M-14);ensure(lines.length*14);doc.setFillColor(...GREEN);doc.circle(M+4,y-3.5,2,"F");doc.setTextColor(...INK);lines.forEach(l=>{doc.text(l,M+14,y);y+=14;});y+=2;};
  header();
  const name=`${A.first||""} ${A.last||""}`.trim();
  doc.setTextColor(...NAVY);doc.setFont("helvetica","bold");doc.setFontSize(20);doc.text(t("resTitle"),M,y);y+=20;
  doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(...MUT);
  doc.text(`${t("resFor")}: ${name} · ${t("profile")[A.exp]||""} · ${t("resDate")}: ${new Date().toLocaleDateString(lang==="es"?"es-US":"en-US")}`,M,y);y+=22;
  // signal box
  doc.setFillColor(...NAVY);doc.roundedRect(M,y,W-2*M,92,10,10,"F");
  ["red","yellow","green"].forEach((c,i)=>{const on=ov.c===c;doc.setFillColor(...(on?COL[c]:[30,44,64]));doc.circle(M+38+i*44,y+46,16,"F");});
  doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(22);doc.text(`${t(ov.c)} · ${ov.score}/100`,M+180,y+40);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(200,210,222);doc.text(doc.splitTextToSize(t(ov.c+"P"),W-2*M-200),M+180,y+60);y+=112;
  h2(t("secDims"));
  Object.keys(t("dims")).forEach(k=>{const c=colorOf(s[k])||"red";ensure(60);doc.setFillColor(...COL[c]);doc.circle(M+5,y-4,5,"F");doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(...INK);doc.text(`${t("dims")[k]} · ${s[k]??0}/100 · ${t(c)}`,M+16,y);y+=15;para(dimText[k][c],9.5,MUT,16);y+=6;});
  h2(t("secNeed")); need.forEach(bullet);
  h2(t("secProd")); prod.forEach(bullet);
  h2(t("secNext")); para(next);
  footer(); doc.addPage(); header();
  h2(t("answers"));
  answerRows().forEach(([q,a])=>{doc.setFont("helvetica","bold");doc.setFontSize(9.5);const ql=doc.splitTextToSize(q,W-2*M);doc.setFont("helvetica","normal");const al=doc.splitTextToSize(a,W-2*M);ensure((ql.length+al.length)*13+8);
   doc.setFont("helvetica","bold");doc.setTextColor(...NAVY);ql.forEach(l=>{doc.text(l,M,y);y+=12.5;});doc.setFont("helvetica","normal");doc.setTextColor(...INK);al.forEach(l=>{doc.text(l,M,y);y+=12.5;});y+=6;});
  y+=6; h2(t("secContact"));
  para(`${lang==="es"?"Llamadas":"Call"}: ${CONTACT.call}   ·   ${lang==="es"?"Texto":"Text"}: ${CONTACT.text}   ·   ${CONTACT.email1}   ·   ${CONTACT.email2}   ·   ${CONTACT.web}`,10);
  y+=4; para(t("disclaimer"),8.5,MUT);
  footer();
  const fname=`Semaforo_Nork_${(name||"inversionista").replace(/[^\p{L}\p{N}]+/gu,"_")}.pdf`;
  const dl=window.claude&&window.claude.use?await window.claude.use("downloads").catch(()=>null):null;
  if(dl){ try{await dl.save({filename:fname,data:doc.output("blob")});toast(t("pdfOk"),true);}catch(e){ if(e&&e.code!=="declined") toast(t("pdfFail"));} }
  else { doc.save(fname); toast(t("pdfOk"),true); }
 }catch(e){ toast(t("pdfFail")); }
}

/* ===== Lead submission (website) ===== */
async function sendLead(){
 const {s,ov}=analysis(); const payload={_subject:`Semáforo Nork: ${A.first||""} ${A.last||""} · ${t(ov.c)}`,form:"Semaforo del Inversionista",language:lang,color:ov.c,score:ov.score,
  experiencia:s.exp,liquidez:s.liq,credito:s.cred,conocimiento:s.know,profile:A.exp,name:`${A.first||""} ${A.last||""}`.trim(),email:A.email,phone:A.phone,referido_por:A.ref||""};
 answerRows().forEach(([q,a])=>{payload[q]=a;});
 try{const r=await fetch(FORMSPREE_URL,{method:"POST",headers:{"Accept":"application/json","Content-Type":"application/json"},body:JSON.stringify(payload)});
  if(!r.ok) throw 0; toast(t("sent"),true);}catch(e){toast(t("sendFail"));}
}

/* ===== Language + boot ===== */
function setLang(l){lang=l;save();
 document.documentElement.lang=l;
 try{localStorage.setItem("jpLang",l)}catch(e){}
 const lb=document.getElementById("langBtn"); if(lb) lb.textContent=l==="en"?"ES":"EN";
 document.querySelectorAll("nav.site [data-en], #mobileMenu [data-en]").forEach(el=>{const v=el.getAttribute("data-"+l); if(v) el.innerHTML=v;});
 ["tagline","eyebrow","h1","lede"].forEach(k=>document.getElementById(k).textContent=t(k));
 view==="result"?renderResult():renderForm(); paintSignal();}
document.getElementById("langBtn").onclick=()=>setLang(lang==="es"?"en":"es");
document.getElementById("burger").onclick=()=>document.getElementById("mobileMenu").classList.toggle("open");
document.querySelectorAll("#mobileMenu a").forEach(a=>a.addEventListener("click",()=>document.getElementById("mobileMenu").classList.remove("open")));
try{const jl=localStorage.getItem("jpLang"); if(jl==="en"||jl==="es") lang=jl;}catch(e){}
if(location.hash==="#en") lang="en"; if(location.hash==="#es") lang="es";
setLang(lang);
</script>
